<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#252e31">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bolla">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Bolla-Zähler</title>
<style>
@font-face { font-family: "Atkinson Hyperlegible"; font-weight: 400; font-style: normal; font-display: swap; src: url("fonts/atkinson-hyperlegible-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Atkinson Hyperlegible"; font-weight: 700; font-style: normal; font-display: swap; src: url("fonts/atkinson-hyperlegible-latin-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Grenze Gotisch"; font-weight: 400; font-style: normal; font-display: swap; src: url("fonts/grenze-gotisch-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Grenze Gotisch"; font-weight: 700; font-style: normal; font-display: swap; src: url("fonts/grenze-gotisch-latin-700-normal.woff2") format("woff2"); }
/* Layout-Idee: Schiefertafel aus dem Wirtshaus. Kreidestriche auf Schiefer,
   Spieler als Spalten, jede Boll eine Zeile, Eingabe fest am unteren Rand. */
:root {
  color-scheme: dark;
  --schiefer: #252e31;      /* Tafel */
  --schiefer-hell: #303c40; /* Flächen, Knöpfe */
  --linie: #46555a;         /* Trennlinien */
  --kreide: #edebe3;        /* Schrift, Striche */
  --kreide-matt: #9eaaa8;   /* Nebentext */
  --schellen: #e6b541;      /* gspannt */
  --herz: #e0604f;          /* Boll */
  --font-display: "Grenze Gotisch", "Luminari", "Palatino Linotype", Georgia, serif;
  --font-body: "Atkinson Hyperlegible", -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: #252e31; }
body {
  background: var(--schiefer);
  color: var(--kreide);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.4;
  -webkit-text-size-adjust: 100%;
}
#app { height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top); }
h1, h2 { font-family: var(--font-display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: .01em; }
h1 { font-size: 2.6rem; line-height: 1; }
h2 { font-size: 1.6rem; line-height: 1.1; }
p { margin: 0; }
.matt { color: var(--kreide-matt); }
.klein { font-size: .875rem; }

button, input { font: inherit; color: inherit; }
button {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  cursor: pointer;
  border: 1.5px solid var(--linie);
  background: var(--schiefer-hell);
  border-radius: 10px;
  min-height: 44px;
  padding: 8px 14px;
}
button:active:not(:disabled) { transform: translateY(1px); background: var(--linie); }
button:disabled { opacity: .4; cursor: default; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--schellen); outline-offset: 2px; }
.haupt { background: var(--kreide); color: var(--schiefer); border-color: var(--kreide); font-weight: 700; }
.haupt:active:not(:disabled) { background: #cfcdc4; }
.still { background: transparent; }
.warn { border-color: var(--herz); color: var(--herz); }
input[type=text] {
  background: transparent; border: 1.5px solid var(--linie); border-radius: 10px;
  min-height: 44px; padding: 8px 12px; min-width: 0; flex: 1;
}
input::placeholder { color: var(--kreide-matt); }

/* Seiten ohne Tafel */
.seite { padding: 28px 16px calc(24px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 20px; overflow-y: auto; height: 100%; }
.kopf { display: flex; flex-direction: column; gap: 6px; }
.zeile { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.zeile.auseinander { justify-content: space-between; }
.modi { display: flex; flex-direction: column; gap: 10px; }
.modus { display: flex; align-items: center; gap: 16px; text-align: left; padding: 12px 16px; }
.modus .zahl { font-family: var(--font-display); font-size: 2.6rem; line-height: 1; width: 1.1em; text-align: center; }
.modus .wer { font-weight: 700; font-size: 1.1rem; }
.kasten { border: 1.5px solid var(--linie); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.kasten.laeuft { border-color: var(--schellen); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border-radius: 999px; padding: 8px 14px; display: inline-flex; gap: 8px; align-items: center; }
.chip[aria-pressed=true] { background: var(--kreide); color: var(--schiefer); border-color: var(--kreide); font-weight: 700; }
.chip .platz { font-variant-numeric: tabular-nums; opacity: .7; }
.liste { display: flex; flex-direction: column; }
.liste > div { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--linie); }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--linie); }
th { color: var(--kreide-matt); font-weight: 400; font-size: .875rem; }
td.z, th.z { text-align: right; }

/* Tafel */
.leiste { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 16px; border-bottom: 1.5px solid var(--linie); }
.leiste .titel { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; line-height: 1; text-align: center; }
.leiste .titel small { display: block; font-family: var(--font-body); font-size: .8rem; font-weight: 400; color: var(--kreide-matt); margin-top: 3px; }
.leiste button { min-height: 40px; padding: 6px 10px; font-size: .875rem; }
.tafel { flex: 1; overflow-y: auto; padding: 0 16px; }
.reihe { display: grid; grid-template-columns: 26px repeat(var(--n), minmax(0, 1fr)); align-items: center; }
.reihe > * { padding: 8px 4px; text-align: center; min-width: 0; }
.reihe .nr { color: var(--kreide-matt); font-size: .8rem; font-variant-numeric: tabular-nums; text-align: left; padding-left: 0; }
.reihe.namen { position: sticky; top: 0; background: var(--schiefer); border-bottom: 1.5px solid var(--kreide-matt); z-index: 1; }
.reihe.namen .name { font-weight: 700; overflow-wrap: anywhere; line-height: 1.15; }
.reihe.namen .bolla { display: block; font-weight: 400; font-size: .85rem; color: var(--kreide-matt); font-variant-numeric: tabular-nums; margin-top: 2px; }
.reihe.namen .bolla b { color: var(--herz); font-weight: 400; }
.reihe.alt { border-bottom: 1px solid var(--linie); color: var(--kreide-matt); }
.reihe.alt .feld { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 34px; }
.reihe.jetzt .feld { display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 96px; justify-content: center; }
.reihe .ohne { grid-column: 1 / -1; padding: 0 0 6px; font-size: .75rem; letter-spacing: .06em; text-transform: uppercase; color: var(--kreide-matt); }
.tally line { stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; }
.reihe.alt .tally line { stroke-width: 2; }
.punkt { display: inline-block; width: 16px; height: 16px; border-radius: 50%; background: var(--herz); flex: none; }
.stand { font-size: .8rem; color: var(--kreide-matt); font-variant-numeric: tabular-nums; }
.feld.gspannt { color: var(--schellen); }
.feld.gspannt .stand { color: var(--schellen); font-weight: 700; }
.feld.raus { opacity: .45; }
.feld.raus .stand { text-transform: uppercase; letter-spacing: .06em; }

.eingabe { border-top: 1.5px solid var(--linie); padding: 10px 16px calc(16px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; background: var(--schiefer); }
.meldung { min-height: 1.4em; font-size: .9rem; color: var(--schellen); text-wrap: balance; }
.eingabe .reihe > * { padding: 0 4px; }
.steller { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
.steller button { padding: 0; font-size: 1.4rem; line-height: 1; }
.steller .plus { min-height: 52px; }
.steller .minus { min-height: 36px; }
.steller .neu { font-family: var(--font-display); font-size: 1.5rem; line-height: 1; font-variant-numeric: tabular-nums; }
.steller .neu.null { color: var(--kreide-matt); }
.bollknopf { width: 100%; min-height: 64px; border-color: var(--herz); padding: 6px 2px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: .85rem; }
.aktionen { display: flex; gap: 10px; }
.aktionen .haupt { flex: 1; }

/* Zu zweit */
.duell { flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 16px; overflow-y: auto; }
.duell .kasten { flex: 1; align-items: center; justify-content: center; gap: 6px; }
.duell .punkte { font-family: var(--font-display); font-size: 5rem; line-height: 1; font-variant-numeric: tabular-nums; }
.duell .kasten button { width: 100%; min-height: 64px; font-size: 1.3rem; font-weight: 700; }
@media (prefers-reduced-motion: reduce) { button:active:not(:disabled) { transform: none; } }
</style>
</head>
<body>
<div id="app"></div>
<script>
//LOGIC-START
const LIMIT = 7;
const STUFE = { 4: 'Rufdeck', 3: 'Badisch', 2: 'Scharf' };

function newRound(n) { return { strokes: Array(n).fill(0), out: [], pick: null, boll: null }; }
function currentRound(s) { return s.rounds[s.rounds.length - 1]; }
function activeOf(s) {
  const r = currentRound(s);
  return s.players.map((_, i) => i).filter(i => !r.out.includes(i));
}
// 'play' = Striche eintragen, 'pick' = es wird bestimmt, wer die Boll bekommt
function phaseOf(s) {
  const r = currentRound(s);
  if (r.pick) return { kind: 'pick', candidates: r.pick, alle: true };
  const a = activeOf(s);
  if (a.length === 2) return { kind: 'pick', candidates: a, alle: false };
  return { kind: 'play', active: a };
}
// i = null: Runde endet ohne Boll (nur wenn alle gleichzeitig die 7 erreicht haben)
function giveBoll(s, i, auto) {
  const r = currentRound(s);
  r.boll = i; r.pick = null;
  if (i === null) r.keine = true;
  s.rounds.push(newRound(s.players.length));
  return { type: 'boll', player: i, auto: !!auto };
}
function commitGame(s, add) {
  const r = currentRound(s);
  const a = activeOf(s);
  a.forEach(i => { r.strokes[i] += (add[i] || 0); });
  const gone = a.filter(i => r.strokes[i] >= LIMIT);
  const rest = a.filter(i => r.strokes[i] < LIMIT);
  r.out.push(...gone);
  if (rest.length === 0) { r.pick = a; return { type: 'alle', gone }; }
  if (rest.length === 1) { const e = giveBoll(s, rest[0], true); e.gone = gone; return e; }
  return { type: gone.length ? 'raus' : 'ok', gone, rest: rest.length };
}
function bollCounts(s) {
  const c = s.players.map(() => 0);
  s.rounds.forEach(r => { if (r.boll !== null) c[r.boll]++; });
  return c;
}
function summarize(s) {
  const e = { mode: s.mode, date: s.startedAt, players: s.players };
  if (s.mode === 2) e.points = s.points.slice(); else e.bolls = bollCounts(s);
  return e;
}
function aggregate(entries, mode) {
  const m = new Map();
  entries.filter(e => e.mode === mode).forEach(e => {
    e.players.forEach((p, i) => {
      const x = m.get(p.id) || { name: p.name, abende: 0, wert: 0 };
      x.name = p.name; x.abende++; x.wert += (mode === 2 ? e.points[i] : e.bolls[i]);
      m.set(p.id, x);
    });
  });
  return [...m.values()].sort((a, b) => b.wert - a.wert || a.name.localeCompare(b.name));
}
//LOGIC-END

// ---------- Speicher ----------
const KEY = 'bolla-zaehler-v1';
let db = { players: [], session: null, archive: [], undo: [] };
try {
  const raw = localStorage.getItem(KEY);
  if (raw) db = Object.assign(db, JSON.parse(raw));
} catch (e) { /* ohne Speicher läuft die App nur bis zum Schließen */ }
function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} }

// ---------- Zustand der Oberfläche ----------
let view = db.session ? 'game' : 'start';
let setupMode = 4, chosen = [], pending = [], flash = '', armed = null, armTimer = null, lastResult = null;

const esc = t => String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const nameOf = i => db.session.players[i].name;

function tally(n, h) {
  const w = h * 1.3, v = Math.min(n, 5);
  let p = '';
  for (let i = 0; i < v; i++) {
    const x = w * 0.16 + i * w * 0.17, j = ((i * 37) % 5 - 2) * 0.012 * w;
    p += `<line x1="${(x + j).toFixed(1)}" y1="${(h * 0.12).toFixed(1)}" x2="${(x - j).toFixed(1)}" y2="${(h * 0.88).toFixed(1)}"/>`;
  }
  if (n >= 6) p += `<line x1="${(w * 0.03).toFixed(1)}" y1="${(h * 0.62).toFixed(1)}" x2="${(w * 0.97).toFixed(1)}" y2="${(h * 0.38).toFixed(1)}"/>`;
  return `<svg class="tally" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true">${p}</svg>`;
}
function armBtn(key, label, sure, cls) {
  const on = armed === key;
  return `<button class="${on ? 'warn' : (cls || 'still')}" data-act="arm" data-key="${key}">${on ? sure : label}</button>`;
}

// ---------- Ansichten ----------
function vStart() {
  const s = db.session;
  let laeuft = '';
  if (s) {
    laeuft = `<div class="kasten laeuft">
      <p><strong>Laufender Abend</strong><br><span class="matt">${STUFE[s.mode]} mit ${s.players.map(p => esc(p.name)).join(', ')}</span></p>
      <button class="haupt" data-act="nav" data-v="game">Weiterspielen</button>
    </div>`;
  }
  const modus = (n, text) => `<button class="modus" data-act="mode" data-n="${n}" ${s ? 'disabled' : ''}>
      <span class="zahl">${n}</span><span><span class="wer">${STUFE[n]}</span><br><span class="matt klein">${text}</span></span></button>`;
  return `<div class="seite">
    <div class="kopf"><h1>Bolla-Zähler</h1><p class="matt">Die Strichliste für die Kartenrunde.</p></div>
    ${laeuft}
    <div class="modi">
      ${modus(4, 'Zu viert. Bei 7 Strichen raus, dann Badisch, dann Scharf.')}
      ${modus(3, 'Zu dritt. Bei 7 Strichen raus, dann Scharf.')}
      ${modus(2, 'Zu zweit. Punkte hochzählen.')}
    </div>
    ${s ? '<p class="matt klein">Für einen neuen Abend erst den laufenden beenden.</p>' : ''}
    <div class="zeile">
      <button class="still" data-act="nav" data-v="stats">Statistik</button>
      <button class="still" data-act="nav" data-v="settings">Einstellungen</button>
    </div>
  </div>`;
}

function addForm() {
  return `<form class="zeile" data-form="add" style="flex-wrap:nowrap">
    <input type="text" id="neuer-spieler" maxlength="14" placeholder="Neuer Spieler" autocomplete="off" aria-label="Name des neuen Spielers">
    <button type="submit">Hinzufügen</button></form>`;
}

function vSetup() {
  const n = setupMode;
  const chips = db.players.map(p => {
    const pos = chosen.indexOf(p.id);
    return `<button class="chip" aria-pressed="${pos >= 0}" data-act="toggle" data-id="${p.id}">${pos >= 0 ? `<span class="platz">${pos + 1}</span>` : ''}${esc(p.name)}</button>`;
  }).join('');
  return `<div class="seite">
    <div class="kopf"><h2>${STUFE[n]}: ${n} Spieler wählen</h2>
      <p class="matt">Die Reihenfolge beim Antippen ist die Reihenfolge der Spalten.</p></div>
    <div class="chips">${chips || '<p class="matt">Noch keine Spieler gespeichert. Leg unten die ersten an.</p>'}</div>
    ${addForm()}
    <div class="zeile auseinander">
      <button class="still" data-act="nav" data-v="start">Zurück</button>
      <button class="haupt" data-act="start" ${chosen.length === n ? '' : 'disabled'}>Abend starten (${chosen.length}/${n})</button>
    </div>
  </div>`;
}

function vGame() {
  const s = db.session;
  if (!s) return vStart();
  const beenden = armBtn('end', 'Beenden', 'Wirklich?', 'still');
  if (s.mode === 2) {
    return `<div class="leiste"><button class="still" data-act="nav" data-v="start">Start</button>
      <div class="titel">Scharf</div>${beenden}</div>
      <div class="duell">
        ${s.players.map((p, i) => `<div class="kasten"><div><strong>${esc(p.name)}</strong></div>
          <div class="punkte">${s.points[i]}</div>
          <button data-act="point" data-i="${i}" aria-label="Ein Punkt für ${esc(p.name)}">+1</button></div>`).join('')}
      </div>
      <div class="eingabe"><div class="aktionen"><button data-act="undo" ${db.undo.length ? '' : 'disabled'}>Rückgängig</button></div></div>`;
  }
  const n = s.players.length, r = currentRound(s), ph = phaseOf(s), counts = bollCounts(s);
  const stufe = ph.kind === 'pick' ? 'Scharf' : STUFE[ph.active.length];
  const head = `<div class="reihe namen"><div class="nr"></div>${s.players.map((p, i) =>
    `<div class="name">${esc(p.name)}<span class="bolla"><b>●</b> ${counts[i]}</span></div>`).join('')}</div>`;
  const alt = s.rounds.slice(0, -1).map((x, k) => `<div class="reihe alt"><div class="nr">${k + 1}</div>${x.strokes.map((v, i) =>
    `<div class="feld">${x.boll === i ? '<span class="punkt" role="img" aria-label="Boll"></span>' : tally(v, 20)}</div>`).join('')}${x.keine ? '<div class="ohne">ohne Boll</div>' : ''}</div>`).join('');
  const jetzt = `<div class="reihe jetzt"><div class="nr">${s.rounds.length}</div>${r.strokes.map((v, i) => {
    const raus = r.out.includes(i), gsp = v === 6;
    return `<div class="feld ${raus ? 'raus' : ''} ${gsp ? 'gspannt' : ''}">${tally(v, 46)}
      <span class="stand">${raus ? 'raus' : gsp ? 'gspannt' : v + (v === 1 ? ' Strich' : ' Striche')}</span></div>`;
  }).join('')}</div>`;

  let panel;
  if (ph.kind === 'play') {
    const sum = pending.reduce((a, b) => a + (b || 0), 0);
    panel = `<div class="reihe" style="--n:${n}"><div></div>${s.players.map((p, i) => ph.active.includes(i) ? `<div class="steller">
        <button class="plus" data-act="inc" data-i="${i}" aria-label="Ein Strich mehr für ${esc(p.name)}">+</button>
        <div class="neu ${pending[i] ? '' : 'null'}">+${pending[i] || 0}</div>
        <button class="minus still" data-act="dec" data-i="${i}" ${pending[i] ? '' : 'disabled'} aria-label="Ein Strich weniger für ${esc(p.name)}">−</button>
      </div>` : '<div class="matt klein">raus</div>').join('')}</div>
      <div class="aktionen"><button data-act="undo" ${db.undo.length ? '' : 'disabled'}>Rückgängig</button>
      <button class="haupt" data-act="commit" ${sum ? '' : 'disabled'}>Spiel eintragen</button></div>`;
  } else {
    panel = `<div class="reihe" style="--n:${n}"><div></div>${s.players.map((p, i) => ph.candidates.includes(i)
        ? `<div><button class="bollknopf" data-act="boll" data-i="${i}"><span class="punkt"></span>Boll</button></div>`
        : '<div class="matt klein">raus</div>').join('')}</div>
      <div class="aktionen"><button data-act="undo" ${db.undo.length ? '' : 'disabled'}>Rückgängig</button>
      ${ph.alle ? '<button class="haupt" data-act="keine">Keine Boll</button>' : ''}</div>`;
  }
  const frage = ph.kind === 'pick' && !flash
    ? (ph.alle ? 'Alle haben gleichzeitig 7 erreicht. Wer bekommt die Boll, oder bekommt keiner eine?' : `Scharf: ${ph.candidates.map(nameOf).map(esc).join(' gegen ')}. Wer bekommt die Boll?`)
    : flash;
  return `<div class="leiste"><button class="still" data-act="nav" data-v="start">Start</button>
      <div class="titel">${stufe}<small>${s.rounds.length}. Boll</small></div>${beenden}</div>
    <div class="tafel" id="tafel" style="--n:${n}">${head}${alt}${jetzt}</div>
    <div class="eingabe"><div class="meldung" role="status">${frage}</div>${panel}</div>`;
}

function ergebnisTabelle(rows, wert) {
  if (!rows.length) return '<p class="matt klein">Noch keine Abende.</p>';
  return `<table><thead><tr><th>Spieler</th><th class="z">Abende</th><th class="z">${wert}</th></tr></thead><tbody>
    ${rows.map(x => `<tr><td>${esc(x.name)}</td><td class="z">${x.abende}</td><td class="z">${x.wert}</td></tr>`).join('')}</tbody></table>`;
}

function vResult() {
  const e = lastResult;
  if (!e) return vStart();
  const rows = e.players.map((p, i) => ({ name: p.name, wert: e.mode === 2 ? e.points[i] : e.bolls[i] }))
    .sort((a, b) => b.wert - a.wert);
  return `<div class="seite"><div class="kopf"><h2>Abend beendet</h2><p class="matt">${STUFE[e.mode]}, ${new Date(e.date).toLocaleDateString('de-DE')}</p></div>
    <table><thead><tr><th>Spieler</th><th class="z">${e.mode === 2 ? 'Punkte' : 'Bolla'}</th></tr></thead><tbody>
    ${rows.map(x => `<tr><td>${esc(x.name)}</td><td class="z">${x.wert}</td></tr>`).join('')}</tbody></table>
    <div class="zeile"><button class="haupt" data-act="nav" data-v="start">Zur Startseite</button></div></div>`;
}

function vStats() {
  const all = db.archive.concat(db.session ? [summarize(db.session)] : []);
  return `<div class="seite"><div class="kopf"><h2>Statistik</h2>
    <p class="matt">Alle beendeten Abende${db.session ? ' und der laufende' : ''}, getrennt nach Start-Modus.</p></div>
    <div class="kasten"><strong>Start zu viert (Rufdeck)</strong>${ergebnisTabelle(aggregate(all, 4), 'Bolla')}</div>
    <div class="kasten"><strong>Start zu dritt (Badisch)</strong>${ergebnisTabelle(aggregate(all, 3), 'Bolla')}</div>
    <div class="kasten"><strong>Zu zweit (Scharf)</strong>${ergebnisTabelle(aggregate(all, 2), 'Punkte')}</div>
    <div class="zeile auseinander"><button class="still" data-act="nav" data-v="start">Zurück</button>
    ${db.archive.length ? armBtn('resetStats', 'Statistik leeren', 'Wirklich alles löschen?') : ''}</div></div>`;
}

function vSettings() {
  const busy = db.session ? db.session.players.map(p => p.id) : [];
  return `<div class="seite"><div class="kopf"><h2>Einstellungen</h2><p class="matt">Spielerliste bearbeiten.</p></div>
    <div class="liste">${db.players.map(p => `<div><span>${esc(p.name)}</span>${busy.includes(p.id)
      ? '<span class="matt klein">spielt gerade</span>' : armBtn('del:' + p.id, 'Entfernen', 'Wirklich entfernen?')}</div>`).join('')
      || '<p class="matt">Noch keine Spieler gespeichert.</p>'}</div>
    ${addForm()}
    <p class="matt klein">Entfernte Spieler bleiben in der Statistik stehen.</p>
    <div class="zeile"><button class="still" data-act="nav" data-v="start">Zurück</button></div></div>`;
}

function render() {
  const app = document.getElementById('app');
  app.innerHTML = ({ start: vStart, setup: vSetup, game: vGame, result: vResult, stats: vStats, settings: vSettings }[view] || vStart)();
  const t = document.getElementById('tafel');
  if (t) t.scrollTop = t.scrollHeight;
}

// ---------- Aktionen ----------
function snapshot() { db.undo.push(JSON.stringify(db.session)); if (db.undo.length > 60) db.undo.shift(); }
function endSession() {
  const s = db.session, e = summarize(s);
  const hatWas = s.mode === 2 ? s.points.some(Boolean) : e.bolls.some(Boolean);
  if (hatWas) db.archive.push(e);
  lastResult = hatWas ? e : null;
  db.session = null; db.undo = []; pending = []; flash = '';
  view = hatWas ? 'result' : 'start';
}
const armedActions = {
  end: endSession,
  resetStats: () => { db.archive = []; },
};
function runArmed(key) {
  if (key.startsWith('del:')) { const id = key.slice(4); db.players = db.players.filter(p => p.id !== id); }
  else armedActions[key]();
  save();
}
function liste(idx) {
  const n = idx.map(nameOf);
  return n.length > 1 ? n.slice(0, -1).join(', ') + ' und ' + n[n.length - 1] : n[0];
}

document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const act = b.dataset.act, i = Number(b.dataset.i), s = db.session;
  if (act !== 'arm' && armed) { armed = null; clearTimeout(armTimer); }
  switch (act) {
    case 'nav': view = b.dataset.v; break;
    case 'mode': setupMode = Number(b.dataset.n); chosen = []; view = 'setup'; break;
    case 'toggle': {
      const id = b.dataset.id, k = chosen.indexOf(id);
      if (k >= 0) chosen.splice(k, 1); else if (chosen.length < setupMode) chosen.push(id);
      break;
    }
    case 'start': {
      const players = chosen.map(id => db.players.find(p => p.id === id)).filter(Boolean).map(p => ({ id: p.id, name: p.name }));
      if (players.length !== setupMode) break;
      db.session = { mode: setupMode, players, startedAt: Date.now() };
      if (setupMode === 2) db.session.points = [0, 0]; else db.session.rounds = [newRound(setupMode)];
      db.undo = []; pending = []; flash = ''; view = 'game'; save();
      break;
    }
    case 'inc': pending[i] = (pending[i] || 0) + 1; flash = ''; break;
    case 'dec': pending[i] = Math.max(0, (pending[i] || 0) - 1); break;
    case 'commit': {
      snapshot();
      const e = commitGame(s, pending);
      pending = [];
      const raus = e.gone && e.gone.length ? `${esc(liste(e.gone))} ${e.gone.length > 1 ? 'haben' : 'hat'} 7 Striche und ${e.gone.length > 1 ? 'sind' : 'ist'} raus. ` : '';
      if (e.type === 'boll') flash = `${raus}${esc(nameOf(e.player))} bleibt übrig und bekommt die Boll. Neue Boll, alle bei 0.`;
      else if (e.type === 'raus') flash = e.rest === 2 ? '' : `${raus}Weiter im ${STUFE[e.rest]}en.`;
      else flash = '';
      save();
      break;
    }
    case 'boll': snapshot(); giveBoll(s, i, false); flash = `${esc(nameOf(i))} bekommt die Boll. Neue Boll, alle bei 0.`; save(); break;
    case 'keine': snapshot(); giveBoll(s, null, false); flash = 'Keine Boll vergeben. Neue Boll, alle bei 0.'; save(); break;
    case 'point': snapshot(); s.points[i]++; save(); break;
    case 'undo':
      if (db.undo.length) { db.session = JSON.parse(db.undo.pop()); pending = []; flash = 'Letzte Eingabe zurückgenommen.'; save(); }
      break;
    case 'arm': {
      const key = b.dataset.key;
      clearTimeout(armTimer);
      if (armed === key) { armed = null; runArmed(key); }
      else { armed = key; armTimer = setTimeout(() => { armed = null; render(); }, 3500); }
      break;
    }
  }
  render();
});

document.addEventListener('submit', ev => {
  ev.preventDefault();
  if (ev.target.dataset.form !== 'add') return;
  const inp = ev.target.querySelector('input'), name = inp.value.trim();
  if (!name) return;
  if (db.players.some(p => p.name.toLowerCase() === name.toLowerCase())) { inp.select(); return; }
  const p = { id: uid(), name };
  db.players.push(p);
  if (view === 'setup' && chosen.length < setupMode) chosen.push(p.id);
  save(); render();
  const again = document.getElementById('neuer-spieler');
  if (again) again.focus();
});

render();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
